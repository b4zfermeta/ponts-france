name: Sources officielles des limites de vitesse
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 5 * *'
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Telecharger panneaux VMA, voitures radars, DiaLog et restrictions
        run: |
          cat > sources.py <<'PYEOF'
          # Sources officielles de limites de vitesse -> branche "sources"
          import csv, io, json, math, os, re, time, gzip, zipfile, urllib.request
          from collections import Counter, defaultdict
          OUT = 'out'; os.makedirs(OUT, exist_ok=True)
          UA = {'User-Agent': 'tracktour-sources/1.0 (github actions)'}
          BB = (45.0, 49.0, -3.0, 1.5)  # ouest de la France (Vendée, 79, 44, 49, 17, 86...)
          def inbb(la, lo): return BB[0] <= la <= BB[1] and BB[2] <= lo <= BB[3]
          def get(url): return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=900)
          def resources(slug):
              j = json.load(get(f'https://www.data.gouv.fr/api/1/datasets/{slug}/'))
              return sorted(j['resources'], key=lambda r: r.get('last_modified') or '', reverse=True)
          def num(s):
              try: return float(str(s).strip().strip('"').replace(',', '.'))
              except Exception: return None
          report = {}

          # 1) Panneaux VMA de la Sécurité routière (DSR) -> tuiles s/ [lat, lon, valeur B14, drapeaux]
          FL = {'EB10': 1, 'EB20': 2, 'B33': 4, 'C107': 8, 'C108': 16, 'C207': 32, 'C208': 64}
          try:
              res = [r for r in resources('donnees-de-signalisation-routiere-determinant-la-vitesse-maximale-autorisee')
                     if (r.get('format') or '').lower() == 'zip' or r['url'].lower().endswith('.zip')]
              z = zipfile.ZipFile(io.BytesIO(get(res[0]['url']).read()))
              rows, codes, files = [], Counter(), []
              for n in z.namelist():
                  if not n.lower().endswith('.csv'): continue
                  lines = z.read(n).decode('utf-8-sig', errors='replace').splitlines(); files.append([n, lines[0][:80] if lines else ''])
                  for fields in csv.reader(lines[1:]):
                      line = ','.join(fields)
                      m = re.findall(r'(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)', line)
                      if not m: continue
                      la, lo = float(m[-1][0]), float(m[-1][1]); v, f = 0, 0
                      for k, val in re.findall(r'"?([A-Za-z]{1,3}\d+[A-Za-z0-9]*)"?\s*=>\s*(?:"([^"]*)"|NULL)', line):
                          k = k.upper() if k[0] != 'M' else k; codes[k] += 1
                          if k == 'B14' and val.isdigit(): v = int(val)
                          if k in FL: f |= FL[k]
                          if k.upper().startswith('M4'): f |= 128
                      rows.append([round(la, 5), round(lo, 5), v, f])
              tiles = defaultdict(list)
              for r in rows: tiles[f'{math.floor(r[0] * 4) / 4:.2f}_{math.floor(r[1] * 4) / 4:.2f}'].append(r)
              os.makedirs(OUT + '/s', exist_ok=True)
              for k, rr in tiles.items():
                  with open(f'{OUT}/s/{k}.json', 'w') as f: json.dump(rr, f, separators=(',', ':'))
              report['panneaux_DSR'] = {'fichier': res[0].get('title'), 'date': res[0].get('last_modified'), 'csv': files,
                  'panneaux': len(rows), 'tuiles': len(tiles), 'dans_zone_ouest': sum(1 for r in rows if inbb(r[0], r[1])),
                  'codes': codes.most_common(40), 'exemples': rows[:8]}
          except Exception as e:
              report['panneaux_DSR'] = {'erreur': repr(e)}

          # 2) Voitures radars (DVVRCE) : on garde la zone ouest, regroupée par point (~10 m)
          try:
              r0 = [r for r in resources('619f8727e07d975a56664c61') if (r.get('format') or '').lower() == 'csv'][0]
              # téléchargement avec reprise : le serveur coupe parfois la connexion
              if os.path.exists('radar.csv'): os.remove('radar.csv')
              for essai in range(10):
                  try:
                      pos = os.path.getsize('radar.csv') if os.path.exists('radar.csv') else 0
                      h = dict(UA, Range=f'bytes={pos}-') if pos else UA
                      resp = urllib.request.urlopen(urllib.request.Request(r0['url'], headers=h), timeout=300)
                      if pos and resp.status != 206: pos = 0
                      with open('radar.csv', 'ab' if pos else 'wb') as f:
                          while True:
                              b = resp.read(1 << 20)
                              if not b: break
                              f.write(b)
                      break
                  except Exception as e:
                      print('radars : coupure', essai + 1, repr(e)); time.sleep(20)
              else:
                  raise RuntimeError('téléchargement des radars impossible après 10 essais')
              with open('radar.csv', encoding='utf-8-sig', errors='replace') as f:
                  head = f.readline(); d = ';' if head.count(';') >= head.count(',') else ','
                  cols = [c.strip().strip('"') for c in head.strip().split(d)]; low = [c.lower() for c in cols]
                  ila = next((i for i, c in enumerate(low) if 'lat' in c), None)
                  ilo = next((i for i, c in enumerate(low) if 'lon' in c or 'lng' in c), None)
                  ivm = next((i for i, c in enumerate(low) if 'vma' in c or 'limit' in c or 'autoris' in c or ('max' in c and 'vit' in c)), None)
                  agg, first, n, kept = defaultdict(Counter), [], 0, 0
                  for line in f:
                      n += 1
                      if len(first) < 5: first.append(line.strip())
                      if ila is None or ilo is None or ivm is None: continue
                      p = line.rstrip('\n').split(d)
                      if len(p) <= max(ila, ilo, ivm): continue
                      la, lo, v = num(p[ila]), num(p[ilo]), num(p[ivm])
                      if la is None or lo is None or not v or not inbb(la, lo): continue
                      agg[(round(la, 4), round(lo, 4))][int(v)] += 1; kept += 1
              os.remove('radar.csv')
              pts = []
              for (la, lo), c in agg.items():
                  v, k = c.most_common(1)[0]; t = sum(c.values()); pts.append([la, lo, v, t, round(k / t, 2)])
              with gzip.open(OUT + '/radars_vma_ouest.json.gz', 'wt', encoding='utf-8') as f:
                  json.dump(pts, f, separators=(',', ':'))
              report['voitures_radars'] = {'fichier': r0.get('title'), 'date': r0.get('last_modified'), 'colonnes': cols,
                  'colonnes_utilisees': [cols[i] if i is not None else None for i in (ila, ilo, ivm)],
                  'lignes': n, 'releves_zone_ouest': kept, 'points': len(pts), 'exemples': first,
                  'vma': Counter(p[2] for p in pts).most_common(15)}
          except Exception as e:
              report['voitures_radars'] = {'erreur': repr(e)}

          # 3) DiaLog (arrêtés de circulation, format DATEX II)
          try:
              x = get('https://dialog.beta.gouv.fr/api/regulations.xml').read()
              with gzip.open(OUT + '/dialog.xml.gz', 'wb') as f: f.write(x)
              s = x.decode('utf-8', errors='replace')
              report['dialog'] = {'taille_Mo': round(len(x) / 1e6, 1),
                  'balises_vitesse': Counter(re.findall(r'<(\w+:)?(\w*[Ss]peed\w*)', s)).most_common(10),
                  'balises': Counter(t for _, t in re.findall(r'<(\w+:)?(\w+)', s)).most_common(40)}
          except Exception as e:
              report['dialog'] = {'erreur': repr(e)}

          # 4) Restrictions officielles pour la carte TrackTour (ponts, gabarit, tonnage, passages à niveau)
          ODS = {
              'sncf_ponts_rail': 'https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/liste-des-ponts-rail/exports/geojson',
              'sncf_passages_niveau': 'https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/liste-des-passages-a-niveau/exports/geojson',
              'cd49_gabarit': 'https://data.maine-et-loire.fr/api/explore/v2.1/catalog/datasets/224900019_limitation-de-gabarit-en-maine-et-loire/exports/geojson',
              'cd49_tonnage': 'https://data.maine-et-loire.fr/api/explore/v2.1/catalog/datasets/224900019_limitation-de-tonnage-en-maine-et-loire/exports/geojson',
          }
          os.makedirs(OUT + '/restrictions', exist_ok=True); report['restrictions'] = {}
          for name, url in ODS.items():
              try:
                  g = json.load(get(url)); feats = g.get('features', [])
                  with open(f'{OUT}/restrictions/{name}.geojson', 'w', encoding='utf-8') as f:
                      json.dump(g, f, ensure_ascii=False, separators=(',', ':'))
                  champs = Counter()
                  for ft in feats[:1000]: champs.update((ft.get('properties') or {}).keys())
                  report['restrictions'][name] = {'objets': len(feats), 'champs': list(champs),
                      'exemples': [ft.get('properties') for ft in feats[:3]]}
              except Exception as e:
                  report['restrictions'][name] = {'erreur': repr(e)}

          json.dump(report, open(OUT + '/rapport.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1, default=str)
          print(json.dumps(report, ensure_ascii=False, indent=1, default=str)[:8000])

          PYEOF
          python3 sources.py
          du -sh out/*
      - name: Publier (branche sources)
        run: |
          cd out
          git init -q -b sources
          git config user.name "robot-base-pl"; git config user.email "robot@users.noreply.github.com"
          git add -A && git commit -q -m "Sources $(date +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sources
